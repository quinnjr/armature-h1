name: Fuzz

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_head, chunked, framing_differential]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz needs nightly: the sanitizer and coverage instrumentation
      # libFuzzer relies on are nightly-only. `clippy` is requested explicitly
      # because this action installs the minimal profile, which omits it.
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          components: clippy
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # `fuzz/` is its own workspace, so the crate's own clippy run never sees
      # it. Without this the harnesses are the one part of the tree outside the
      # lint gate.
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Fuzz ${{ matrix.target }} for 60s
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1
      # The crash file is the reproducer. Without it the log line naming the
      # input is all that survives the runner, and re-finding it costs a run.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # `backend_differential` drives two runtimes (the native loop and hyper's)
  # per case, with 80ms deadlines on each, so its execs/sec is far below the
  # pure-parsing targets above. Giving it its own job — rather than a matrix
  # row judged against the parser rows' 60s budget — means a slow-but-healthy
  # run doesn't read like a stall, and it gets a longer time budget to
  # compensate for the lower throughput.
  fuzz_backend_differential:
    name: fuzz backend_differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          components: clippy
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # `hyper-backend` is a passthrough feature on the fuzz crate (see
      # fuzz/Cargo.toml): only this target needs the hyper-enabled build, so
      # only this job pays for it — and only this job's clippy run needs the
      # feature on to see `backend_differential` at all (its `required-features`
      # makes `--all-targets` skip it otherwise).
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --features hyper-backend -- -D warnings
      - name: Fuzz backend_differential for 300s
        run: cargo fuzz run backend_differential --features hyper-backend -- -max_total_time=300 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-backend_differential
          path: fuzz/artifacts/
          if-no-files-found: ignore
