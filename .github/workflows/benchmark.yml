name: Benchmark

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: benches compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bench
      # `-- --test` runs each benchmark once instead of timing it. A shared CI
      # runner cannot produce a number worth comparing, so this guards against
      # the thing that actually rots: a benchmark that stops compiling or starts
      # panicking because the API moved under it.
      - run: cargo bench --bench parse -- --test
      - run: cargo bench --bench write -- --test
      - run: cargo bench --bench e2e -- --test
      # `serve_connection` exists specifically so `e2e` is a real A/B harness
      # between the native loop and the hyper backend; without this the hyper
      # side of that comparison never executes anywhere in CI.
      - run: cargo bench --features hyper-backend --bench e2e -- --test
